.holo,.glare{position:absolute;inset:0;pointer-events:none;border-radius:9px}
.holo{mix-blend-mode:color-dodge;opacity:.45;

<script>
(function(){
  var c=document.getElementById('pcard');
  var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(fine){
    c.addEventListener('pointermove',function(e){
      var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      c.style.setProperty('--ry',((x-.5)*16)+'deg');
      c.style.setProperty('--rx',((.5-y)*13)+'deg');
      c.style.setProperty('--mx',(x*100)+'%');
      c.style.setProperty('--my',(y*100)+'%');
    });
    c.addEventListener('pointerleave',function(){
      ['--rx','--ry'].forEach(function(k){c.style.setProperty(k,'0deg')});
      c.style.setProperty('--mx','50%');c.style.setProperty('--my','50%');
    });
  }else{c.classList.add('auto');}
  function flip(){c.classList.toggle('flip');
    if(window.hcfTrack)hcfTrack('card_flip',{coach:c.dataset.coach,to:c.classList.contains('flip')?'back':'front'});}
  c.addEventListener('click',function(e){if(e.target.closest('a,button,input'))return;flip();});
  var fb=document.getElementById('flipBack');if(fb)fb.onclick=flip;
})();
</script>
